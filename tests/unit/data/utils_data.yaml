      +------------------------------------------------------------------------------+
      Hello Python Generic Library
      +------------------------------------------------------------------------------+
  case2:
    data: Hello Python Generic Library
    width: 40
    header: ''
    footer: ''
    failure_msg: ''
    expected_result: |-
      +--------------------------------------+
      Hello Python Generic Library
      +--------------------------------------+
  case3:
    data: Hello Python Generic Library.  This is a very long message which exceeds 80 characters
    width: 60
    header: ''
    footer: ''
    failure_msg: ''
    expected_result: |-
      +------------------------------------------------------------+
      Hello Python Generic Library.  This is a very long message
      which exceeds 80 characters
      +------------------------------------------------------------+
