    data: Hello Python Generic Library.  This is a very long message which exceeds 80 characters
    width: -1
    header: ''
    footer: ''
    failure_msg: ''
    expected_result: |-
      +----------------------------------------------------------------------------------------+
      Hello Python Generic Library.  This is a very long message which exceeds 80 characters
      +----------------------------------------------------------------------------------------+
